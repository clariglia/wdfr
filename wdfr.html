    <script>
      function convertToCSV() {
        let jsonTxt = document.getElementById("jsonTxt").value;
        if (jsonTxt === "") {
          const jsonTxt = document.getElementById("jsonTxt");
          jsonTxt.classList.toggle("is-invalid");
          return;

          jsonText.classList.remove("is-invalid");

        try {
          let data = JSON.parse(jsonTxt);

          if (Array.isArray(data)) {
            let campi = Object.keys(data[0]);
            let res = campi.join(";") + "\n"; //TESTATA

            data.forEach((item) => {
              //CORPO
              let riga = campi
                .map((campo) => {
                  let valore = item[campo];
                  if (typeof valore === "object" && valore !== null) {
                    return JSON.stringify(valore); // Converte l'oggetto in una stringa JSON
                  }
                  return valore || "";
                })
                .join(";");
              res += riga + "\n";
            });
            document.getElementById("csvTxt").value = res;

            //QUACK
            let download = document.getElementById("download");
            download.href =
              "data:text/csv;charset=utf-8," + encodeURIComponent(res);
            download.download = "data.csv";
            download.innerHTML = "Scarica CSV";
            download.style.display = "inline-block";
          } else {
            alert("Il JSON inserito non contiene un array di oggetti!");
          }
        } catch (error) {
          alert("Errore nel parsing del JSON: " + error.message);
        }
      }

      function convertToJSON() {
        let csvTxt = document.getElementById("csvTxt").value;
        try {
          let righe = csvTxt.split("\n");
          let testata = righe[0].split(";");
          let res = [];

          for (let i = 1; i < righe.length; i++) {
            let riga = righe[i].split(";");
            if (riga.length === testata.length) {
              let obj = {};
              for (let j = 0; j < testata.length; j++) {
                let valore = riga[j];
                try {
                  obj[testata[j]] = JSON.parse(valore);
                } catch (e) {
                  obj[testata[j]] = valore;
                }
              }
              res.push(obj);
            }
          }

          let jsonString = JSON.stringify(res, null, 2);
          document.getElementById("jsonTxt").value = jsonString;

          let download = document.getElementById("download");
          const encodedJson = encodeURIComponent(jsonString);
          download.href = "data:text/json;charset=utf-8," + encodedJson;
          download.download = "data.json";
          download.innerHTML = "Scarica JSON";
          download.style.display = "inline-block";
        } catch (error) {
          alert("Errore nel parsing del CSV: " + error.message);
        }
      }

        document.getElementById("csvTxt").value = "";
        document.getElementById("jsonTxt").value = "";
